name: CI/CD Deploy to EC2 (GHCR)

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ci-cd-demo

# Prevent two deploys from running at the same time
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Generate image metadata
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG="sha-${GITHUB_SHA::7}"
          IMAGE="ghcr.io/$OWNER/${{ env.IMAGE_NAME }}"

          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.meta.outputs.image }}:latest \
            -t ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }} \
            .

      - name: Push Docker images
        run: |
          docker push ${{ steps.meta.outputs.image }}:latest
          docker push ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            FULL_IMAGE="${{ needs.build-and-push.outputs.image }}:${{ needs.build-and-push.outputs.tag }}"
            echo "Deploying $FULL_IMAGE"

            # Login using the PAT stored on the server
            cat ~/.ghcr_tokennano | docker login ghcr.io \
              -u Zerocode-sean \
              --password-stdin

            # Pull the new image
            docker pull $FULL_IMAGE

            # Remove the old container by name
            docker rm -f ci-cd-demo || true

            # Remove ANY other container still holding port 80
            docker ps -q --filter "publish=80" | xargs -r docker rm -f

            # Start the new container (host port 80 -> app port 3000)
            docker run -d \
              --name ci-cd-demo \
              --restart unless-stopped \
              -p 80:3000 \
              $FULL_IMAGE

            # Delete all images not used by a running container
            docker image prune -af

            # Health check: retry for up to 30 seconds
            for i in $(seq 1 10); do
              if curl -fsS http://localhost:80 > /dev/null; then
                echo "App responding on port 80"
                break
              fi
              if [ "$i" -eq 10 ]; then
                echo "App did not respond, failing deploy"
                docker logs ci-cd-demo
                exit 1
              fi
              sleep 3
            done

            echo "Running image:"
            docker ps --filter name=ci-cd-demo --format '{{.Image}}  {{.Status}}'