name: CI/CD Deploy to VPS (GHCR)

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ci-cd-demo

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Generate image metadata
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG="sha-${GITHUB_SHA::7}"

          IMAGE="ghcr.io/$OWNER/${{ env.IMAGE_NAME }}"

          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.meta.outputs.image }}:latest \
            -t ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }} \
            .

      - name: Push Docker images
        run: |
          docker push ${{ steps.meta.outputs.image }}:latest
          docker push ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            IMAGE="${{ needs.build-and-push.outputs.image }}"
            TAG="${{ needs.build-and-push.outputs.tag }}"
            FULL_IMAGE="$IMAGE:$TAG"

            echo "Deploying $FULL_IMAGE"

            # Login using PAT stored on the VPS
            cat ~/.ghcr_tokennano | docker login ghcr.io \
              -u Zerocode-sean \
              --password-stdin

            # Pull latest image
            docker pull $FULL_IMAGE

            # Stop old container
            docker stop ci-cd-demo || true
            docker rm ci-cd-demo || true

            # Remove dangling images
            docker image prune -f

            # Start new container
            docker run -d \
              --name ci-cd-demo \
              --restart unless-stopped \
              -p 127.0.0.1:3000:3000 \
              $FULL_IMAGE

            # Verify deployment
            docker ps